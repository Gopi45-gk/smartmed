services:
  backend:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: smartmed-backend
    restart: unless-stopped
    environment:
      - SMARTMED_AI_PORT=8100
      - MNN_MODEL_PATH=/app/mnn/model
      - MNN_DEVICE=cpu
      - MNN_THREAD_NUM=4
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_BASE_URL=${AI_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - AI_MODEL_CHAT=${AI_MODEL_CHAT:-meta/llama-3.1-8b-instruct}
      - AI_MODEL_VOICE=${AI_MODEL_VOICE:-openai/gpt-oss-120b}
      - OPENFDA_API_KEY=${OPENFDA_API_KEY:-}
      - MEDI_CLIENT_ID=${MEDI_CLIENT_ID:-}
      - MEDI_CLIENT_SECRET=${MEDI_CLIENT_SECRET:-}
      - DATA_GOV_IN_API_KEY=${DATA_GOV_IN_API_KEY:-}
      - EXOTEL_SID=${EXOTEL_SID:-}
      - EXOTEL_TOKEN=${EXOTEL_TOKEN:-}
      - EXOTEL_SUBDOMAIN=${EXOTEL_SUBDOMAIN:-api.exotel.com}
      - EXOTEL_CALLER_ID=${EXOTEL_CALLER_ID:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_API_KEY=${TWILIO_API_KEY:-}
      - TWILIO_API_SECRET=${TWILIO_API_SECRET:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - TWILIO_WEBHOOK_BASE_URL=${TWILIO_WEBHOOK_BASE_URL:-https://smart-med.duckdns.org}
      - FLAGS_use_mkldnn=0
      - PADDLE_PDX_ENABLE_MKLDNN_BYDEFAULT=0
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - ./ai/server.py:/app/server.py
      - ./ai/clinical_triage.py:/app/clinical_triage.py
      - ./ai/twilio_service.py:/app/twilio_service.py
      - ./ai/confirmation_service.py:/app/confirmation_service.py
      - ./ai/diabetes_prediction.py:/app/diabetes_prediction.py
      - ./ai/diabetes_model_weights.json:/app/diabetes_model_weights.json
      - ./ai/lab_scan.py:/app/lab_scan.py
      - ./ai/lab_parser.py:/app/lab_parser.py
      - ./ai/glucose.py:/app/glucose.py
      - ./ai/glucose_alerts.py:/app/glucose_alerts.py
      - ./ai/rag:/app/rag
      - ./ai/mnn/model:/app/mnn/model
      - ./ai/tts:/app/tts
      - ./ai/data:/app/data
      - ./ai/ocr:/app/ocr
      - ./ai/modules:/app/modules
      - ./ai/routers:/app/routers
      - hf_cache:/root/.cache/huggingface
      - paddle_cache:/root/.paddleocr
      - paddlex_cache:/root/.paddlex
    ports:
      - "8100:8100"
    networks:
      - smartmed-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartmed-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smartmed-network

networks:
  smartmed-network:
    driver: bridge

volumes:
  hf_cache:
  paddle_cache:
  paddlex_cache:
